{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<div class="global-back">
    <a href="javascript:history.length > 1 ? history.back() : '/'" class="back-btn">
        ← Back
    </a>
</div>
<h1>🛒 Your Cart</h1>

<div class="page-wrapper">
<div class="sparkles"></div>

<div class="cart-container">

    <!-- LEFT: CART ITEMS -->
    <div class="cart-items">

        {% for item in cart_items %}
        <div class="cart-card">

            <!-- SAFE IMAGE -->
            {% if item.product.image %}
                <img src="{{ item.product.image.url }}" class="cart-img">
            {% else %}
                <img src="{% static 'default.jpg' %}" class="cart-img">
            {% endif %}

            <div class="cart-info">
                <h3>{{ item.product.name }}</h3>
                <p>₹{{ item.product.price }}</p>
                <div class="qty-controls">

    <!-- ➖ DECREASE -->
    <a href="{% url 'decrease_quantity' item.id %}" class="qty-btn">−</a>

    <span>{{ item.quantity }}</span>

    <!-- ➕ INCREASE -->
    <a href="{% url 'increase_quantity' item.id %}" class="qty-btn">+</a>

</div>

                <a href="{% url 'remove_from_cart' item.product.id %}" class="remove-btn">
                    Remove
                </a>
            </div>

        </div>
        {% empty %}
            <p>Your cart is empty</p>
        {% endfor %}

    </div>

    <!-- RIGHT: SUMMARY -->
    <div class="cart-summary">
        <h2>Total: ₹{{ total }}</h2>

        <a href="{% url 'checkout' %}" class="primary-btn">
            Proceed to Checkout
        </a>
    </div>

</div>

</div>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>AI Hair Analysis</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<div class="global-back">
    <a href="javascript:history.length > 1 ? history.back() : '/'" class="back-btn">
        ← Back
    </a>
</div>
<body>
<div class="top-nav">
    <a href="/login2/" class="nav-btn">Login</a>
</div>
<div class="page-wrapper">
    <div class="sparkles"></div>
    
<div class="dashboard-card">

<h1>AI Hair Analysis</h1>
<p>Upload scalp image for density & health detection</p>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="image" accept="image/*" required>
    <br><br>
    <button type="submit" class="primary-btn">Analyze Hair</button>
</form>

</div>
</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<div class="global-back">
    <a href="javascript:history.length > 1 ? history.back() : '/'" class="back-btn">
        ← Back
    </a>
</div>
<body>

<div class="page-wrapper">
    <div class="sparkles"></div>
    <div class="login-card">
        <h1>Admin Login</h1>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" class="full-input" placeholder="Username" required>
            <input type="password" name="password" class="full-input" placeholder="Password" required>
            <button type="submit" class="primary-btn">Login</button>
        </form>
    </div>
</div>

</body>
</html>

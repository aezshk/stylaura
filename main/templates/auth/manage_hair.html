{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Manage Hair Profiles</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<div class="global-back">
    <a href="javascript:history.length > 1 ? history.back() : '/'" class="back-btn">
        ← Back
    </a>
</div>
<body>

<div class="page-wrapper">
    <div class="sparkles"></div>
    <div class="dashboard-card">

        <div class="dashboard-header">
            <h1>Manage Hair Profiles</h1>

            <a href="{% url 'admin_dashboard' %}" 
               style="display:inline-block; margin-top:10px; padding:8px 25px; background:#b76e79; color:white; border-radius:20px; text-decoration:none;">
               Back to Dashboard
            </a>
        </div>

        <table style="width:100%; margin-top:20px; background:#fffaf7; border-radius:20px; overflow:hidden;">

            <tr style="background:#e7cfcf; font-weight:600;">
                <th style="padding:12px;">Hair Type</th>
                <th style="padding:12px;">Concerns</th>
            </tr>

            {% for hair in hairs %}
            <tr>
                <td style="padding:12px;">{{ hair.hair_type }}</td>
                <td style="padding:12px;">{{ hair.concerns }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" style="padding:12px; text-align:center;">
                    No hair profiles found
                </td>
            </tr>
            {% endfor %}

        </table>

    </div>
</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Manage Products</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<div class="global-back">
    <a href="javascript:history.length > 1 ? history.back() : '/'" class="back-btn">
        ← Back
    </a>
</div>
<body>
<div class="page-wrapper">
    <div class="sparkles"></div>
    <div class="dashboard-card">
<h2>Edit Product</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input name="name" value="{{ product.name }}">
    <input name="category" value="{{ product.category }}">

    <select name="tier">
        <option value="budget" {% if product.tier == "budget" %}selected{% endif %}>Budget</option>
        <option value="medium" {% if product.tier == "medium" %}selected{% endif %}>Medium</option>
        <option value="luxury" {% if product.tier == "luxury" %}selected{% endif %}>Luxury</option>
    </select>

    <input name="price" value="{{ product.price }}">
    <textarea name="description">{{ product.description }}</textarea>

    <input type="file" name="image">

    <button type="submit">Update</button>
</form>
